name: Rebuild CMS article

on:
  push:
    branches: [main]
    paths:
      - content/articles/website-build.json

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website-build/index.html
          git diff --cached --quiet || git commit -m "Rebuild website article"
          git push
