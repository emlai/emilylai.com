<article><h3>Unicorn gear: first ecommerce store</h3><small>2016 to 2018</small><p>Right after college, I started an ecom business with my roommate. It started as dropshipping. First, we set up a Shopify store, designed a logo, and hooked up Oberlo to AliExpress for dropshipping. I had limited Photoshop skills back then and manipulated an existing logo I found on Google Images. Then we went full on private labeling, packed bags to Asia, and toured 3 factories in Shenzhen.</p><p>We private labeled beanies with built-in Bluetooth speakers. Everything was learned from YouTube videos, blogs, and asking friends.</p><p>A lot goes into building a brand from scratch. Beyond the operational, supply chain, and inventory management, all this was learned from content online:</p><p>Optimizing the Shopify store</p><p>Facebook ads</p><p>Copywriting</p><p>Photoshop for product lays and content</p><p>SEO</p><p>Google AdWords and Shopping</p><p>Email marketing</p><p>(No AI tools back then!)</p><p>Not to mention the brand identity and positioning. We built target personas, reworked USPs, and asked friends for feedback.</p><p>The result: about 60 units sold, and we only made back 50% of the cost of the initial order. Failure by a business sense.</p><p>Looking back at this now, there was so much learned:</p><p>We were selling a seasonal, non-evergreen product.</p><p>Audience was small. Not everyone is cold, wears beanies, or does snow sports.</p><p>Our initial copy and ads were too feature focused: &quot;latest Bluetooth technology&quot; vs. &quot;a concert-level listening experience that feels like floating on clouds&quot;.</p><p>Not enough validation and product feedback: friends and family were too nice and did not give honest feedback.</p><p>Most importantly, it led me to where I am today. Growth and digital marketing is so much fun. Marketing principles are the same today. But there are loads of new tools to use, problems to solve, and stories to share.</p><p><a href="https://x.com/emilylai/status/1807113908173308269">Post on X</a> · <a href="media/unicorngear.webp">View image</a> · <a href="media/unicorngear2.webp">View image</a> · <a href="media/unicorngear3.webp">View image</a></p></article>
